<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jarvis Viewer</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<script type="module" src="app.js"></script>
</head>
<body>
<div id="stage"></div>
<div id="lost" hidden>viewer desligado — peça uma cena para religar</div>
<header>
  <h1 id="title">Jarvis Viewer <span>· aguardando uma cena</span></h1>
  <button id="hprev" title="Cena anterior" disabled>←</button>
  <button id="hnext" title="Próxima cena" disabled>→</button>
  <label id="narr-wrap"><input type="checkbox" id="narr" checked> <span id="narr-label">🔊 Narração</span><small id="narr-hint" hidden>narrado pelo Jarvis</small></label>
  <button id="restart" title="Recomeçar">⟲ Recomeçar</button>
  <button id="play" class="primary" disabled>▶ Explicar</button>
</header>
<div id="caption">
  <div class="step" id="stepn">Pronto</div>
  <div class="text" id="text">Peça uma cena ao Claude: ela aparece aqui e é explicada passo a passo.</div>
  <div id="dots"></div>
</div>
</body>
</html>
