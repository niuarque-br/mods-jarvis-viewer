<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis Viewer</title>
<style>
  :root { --bg:#0b0d12; --fg:#e8ecf3; --dim:#8a93a6; --panel:#141821; --line:#232a37; --accent:#D97757; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:15px/1.45 "Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  canvas { display:block; }
  .label { position:absolute; transform:translate(-50%,0); pointer-events:none; text-align:center; white-space:nowrap;
           font-size:13px; color:var(--dim); transition:color .4s, opacity .4s; }
  .label b { display:block; font-size:15px; color:var(--fg); font-weight:600; }
  .label.on { color:#fff; }
  .label.on b { color:#fff; text-shadow:0 0 12px rgba(255,255,255,.5); }
  header { position:fixed; top:0; left:0; right:0; display:flex; align-items:center; gap:12px; padding:14px 18px;
           background:linear-gradient(var(--bg) 40%, transparent); z-index:2; }
  header h1 { font-size:15px; font-weight:600; margin:0; flex:1; }
  header h1 span { color:var(--dim); font-weight:400; }
  button { background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:8px; padding:7px 12px;
           font:inherit; font-size:13px; cursor:pointer; }
  button:hover { border-color:#3a4458; }
  button.primary { background:var(--accent); border-color:var(--accent); color:#1a0d07; font-weight:600; }
  #caption { position:fixed; left:50%; bottom:28px; transform:translateX(-50%); width:min(760px, calc(100% - 32px));
             background:rgba(20,24,33,.88); border:1px solid var(--line); border-radius:12px; padding:14px 18px; z-index:2;
             backdrop-filter:blur(6px); min-height:56px; }
  #caption .step { color:var(--dim); font-size:12px; margin-bottom:4px; letter-spacing:.04em; text-transform:uppercase; }
  #caption .text { font-size:17px; }
  #dots { display:flex; gap:6px; margin-top:10px; }
  #dots i { flex:1; height:3px; border-radius:2px; background:var(--line); }
  #dots i.done { background:var(--accent); }
</style>
</head>
<body>
<div id="stage"></div>
<header>
  <h1>Como o Modo Jarvis funciona <span>· rascunho do Jarvis Viewer</span></h1>
  <label style="font-size:13px;color:var(--dim)"><input type="checkbox" id="voice" checked> narrar</label>
  <button id="restart">⟲ Recomeçar</button>
  <button id="play" class="primary">▶ Explicar</button>
</header>
<div id="caption">
  <div class="step" id="stepn">Pronto</div>
  <div class="text" id="text">Clique em <b>Explicar</b>: o Jarvis narra e a cena acompanha, passo a passo. Arraste para girar.</div>
  <div id="dots"></div>
</div>

<script type="module">
import * as THREE from '../../helper/web/vendor/three.module.min.js';

// ---- O que o Claude mandaria ao viewer: nós, ligações e passos narrados ----
const scene_spec = {
  nodes: [
    { id:'claude', title:'Claude Code', sub:'mod (register.tsx)', shape:'box',  color:0xD97757, x:-6 },
    { id:'aux',    title:'Auxiliar',    sub:'conversa-helper.exe', shape:'octa', color:0x5B8DEF, x:-2 },
    { id:'win',    title:'Janelinha',   sub:'Edge --app · orbe',   shape:'orb',  color:0x36C5A0, x: 2 },
    { id:'you',    title:'Você',        sub:'microfone e fone',    shape:'person', color:0xE8ECF3, x: 6 },
  ],
  steps: [
    { focus:'you',    hops:[['you','win']],
      say:'Você fala. A janelinha do Jarvis ouve o microfone e transforma a sua voz em texto.' },
    { focus:'aux',    hops:[['win','aux']],
      say:'Esse texto vai para o auxiliar, um programa pequeno que roda só na sua máquina.' },
    { focus:'claude', hops:[['aux','claude']],
      say:'O auxiliar entrega o texto ao mod, e o mod envia como se você tivesse digitado o prompt.' },
    { focus:'aux',    hops:[['claude','aux'],['claude','aux'],['claude','aux']],
      say:'O Claude responde em frases. Cada frase volta para o auxiliar assim que fica pronta, sem esperar o resto.' },
    { focus:'win',    hops:[['aux','win'],['win','you']],
      say:'O auxiliar gera a voz, a janelinha toca, e a orbe acompanha. É assim que você ouve a resposta.' },
  ],
};

// ---- Cena ----
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
stage.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b0d12, 0.018);
const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
scene.add(new THREE.AmbientLight(0xffffff, 0.35));
const key = new THREE.PointLight(0xffffff, 60, 40); key.position.set(0, 6, 8); scene.add(key);

// estrelas
{
  const g = new THREE.BufferGeometry(), n = 700, p = new Float32Array(n * 3);
  for (let i = 0; i < n * 3; i++) p[i] = (Math.random() - .5) * 80;
  g.setAttribute('position', new THREE.BufferAttribute(p, 3));
  scene.add(new THREE.Points(g, new THREE.PointsMaterial({ size:.06, color:0x55607a })));
}
// chão em grade
const grid = new THREE.GridHelper(40, 40, 0x1c2230, 0x151a24); grid.position.y = -1.6; scene.add(grid);

const nodes = {};
for (const n of scene_spec.nodes) {
  const mat = new THREE.MeshStandardMaterial({ color:n.color, emissive:n.color, emissiveIntensity:.15, roughness:.35, metalness:.2 });
  const g = new THREE.Group();
  let mesh;
  if (n.shape === 'box') mesh = new THREE.Mesh(new THREE.BoxGeometry(1.7, 1.15, 1.15), mat);
  else if (n.shape === 'octa') mesh = new THREE.Mesh(new THREE.OctahedronGeometry(0.85), mat);
  else if (n.shape === 'orb') {
    mesh = new THREE.Mesh(new THREE.SphereGeometry(0.75, 48, 48), mat);
    const cage = new THREE.Mesh(new THREE.IcosahedronGeometry(1.05, 1),
      new THREE.MeshBasicMaterial({ color:n.color, wireframe:true, transparent:true, opacity:.35 }));
    g.add(cage); g.userData.cage = cage;
  } else {
    mesh = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.6, 8, 24), mat);
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 32, 32), mat); head.position.y = 0.95; g.add(head);
    mesh.position.y = -0.2;
  }
  g.add(mesh); g.position.set(n.x, 0, 0); scene.add(g);
  const label = document.createElement('div'); label.className = 'label';
  label.innerHTML = `<b>${n.title}</b>${n.sub}`; document.body.appendChild(label);
  nodes[n.id] = { ...n, group:g, mat, label, level:0 };
}

// ligações: arco de cima para "ida" (direita), de baixo para "volta"
const curves = {};
const tubes = [];
function lane(a, b) {
  const A = nodes[a].group.position, B = nodes[b].group.position;
  const up = B.x > A.x ? 1 : -1;
  const mid = A.clone().add(B).multiplyScalar(.5).add(new THREE.Vector3(0, 0.95 * up, 0.4 * up));
  return new THREE.QuadraticBezierCurve3(A.clone(), mid, B.clone());
}
const ids = scene_spec.nodes.map(n => n.id);
for (let i = 0; i < ids.length - 1; i++) for (const [a, b] of [[ids[i], ids[i+1]], [ids[i+1], ids[i]]]) {
  const c = lane(a, b); curves[a + '>' + b] = c;
  const m = new THREE.MeshBasicMaterial({ color:0x6b7894, transparent:true, opacity:.18 });
  const t = new THREE.Mesh(new THREE.TubeGeometry(c, 48, 0.025, 8), m); scene.add(t);
  tubes.push({ key:a + '>' + b, mat:m });
}

// pacotes com rastro
const packets = [];
function spawn(from, to, delay, color) {
  const curve = curves[from + '>' + to];
  const parts = [];
  for (let k = 0; k < 8; k++) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(0.16 * (1 - k / 10), 16, 16),
      new THREE.MeshBasicMaterial({ color, transparent:true, opacity:0 }));
    scene.add(m); parts.push(m);
  }
  packets.push({ curve, parts, t0: clock.getElapsedTime() + delay, dur: 1.3, key: from + '>' + to });
}

// ---- Laço ----
const clock = new THREE.Clock();
let focus = null, yaw = 0, pitch = 0.18, dragging = null;
renderer.domElement.addEventListener('pointerdown', e => dragging = { x:e.clientX, y:e.clientY, yaw, pitch });
addEventListener('pointerup', () => dragging = null);
addEventListener('pointermove', e => {
  if (!dragging) return;
  yaw = dragging.yaw - (e.clientX - dragging.x) * 0.005;
  pitch = Math.max(-0.2, Math.min(0.8, dragging.pitch + (e.clientY - dragging.y) * 0.004));
});
function resize() { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();

const v = new THREE.Vector3();
renderer.setAnimationLoop(() => {
  const t = clock.getElapsedTime();
  const sway = dragging ? 0 : Math.sin(t * 0.15) * 0.18;
  // distância que cabe ~16 unidades de largura em qualquer proporção de janela
  const hfov = 2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
  const r = Math.max(13, 8.2 / Math.tan(hfov / 2));
  camera.position.set(Math.sin(yaw + sway) * r * Math.cos(pitch), 1.2 + Math.sin(pitch) * r, Math.cos(yaw + sway) * r * Math.cos(pitch));
  camera.lookAt(0, 0, 0);

  for (const n of Object.values(nodes)) {
    const want = focus === null ? 0.35 : (n.id === focus ? 1 : 0.12);
    n.level += (want - n.level) * 0.06;
    const pulse = n.id === focus ? 1 + Math.sin(t * 4) * 0.05 : 1;
    n.group.scale.setScalar((0.9 + n.level * 0.3) * pulse);
    n.mat.emissiveIntensity = 0.08 + n.level * 0.9;
    n.group.rotation.y += n.shape === 'octa' ? 0.012 : 0.003;
    if (n.group.userData.cage) n.group.userData.cage.rotation.x += 0.004 + n.level * 0.01;
    v.copy(n.group.position); v.y -= 1.45; v.project(camera);
    n.label.style.left = ((v.x + 1) / 2 * innerWidth) + 'px';
    n.label.style.top = ((1 - v.y) / 2 * innerHeight) + 'px';
    n.label.classList.toggle('on', n.id === focus);
  }

  const live = new Set();
  for (let i = packets.length - 1; i >= 0; i--) {
    const p = packets[i], u = (t - p.t0) / p.dur;
    if (u > 1.25) { p.parts.forEach(m => { scene.remove(m); m.geometry.dispose(); }); packets.splice(i, 1); continue; }
    if (u >= 0 && u <= 1) live.add(p.key);
    p.parts.forEach((m, k) => {
      const uk = u - k * 0.025;
      if (uk < 0 || uk > 1) { m.material.opacity = 0; return; }
      m.position.copy(p.curve.getPoint(uk));
      m.material.opacity = (1 - k / 8) * (u > 1 ? Math.max(0, 1 - (u - 1) * 4) : 1);
    });
  }
  for (const tb of tubes) tb.mat.opacity += ((live.has(tb.key) ? 0.85 : 0.18) - tb.mat.opacity) * 0.1;

  renderer.render(scene, camera);
});

// ---- Narração ----
const $ = id => document.getElementById(id);
const steps = scene_spec.steps;
$('dots').innerHTML = steps.map(() => '<i></i>').join('');
let run = 0;
function sayAloud(text) {
  return new Promise(res => {
    if (!$('voice').checked || !('speechSynthesis' in window)) return res();
    const u = new SpeechSynthesisUtterance(text); u.lang = 'pt-BR'; u.rate = 1.05;
    const pt = speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('pt-br'));
    if (pt) u.voice = pt;
    u.onend = u.onerror = () => res();
    speechSynthesis.speak(u);
  });
}
const wait = ms => new Promise(r => setTimeout(r, ms));
async function explain() {
  const me = ++run; speechSynthesis?.cancel();
  for (let i = 0; i < steps.length; i++) {
    if (me !== run) return;
    const s = steps[i];
    focus = s.focus;
    $('stepn').textContent = `Passo ${i + 1} de ${steps.length}`;
    $('text').textContent = s.say;
    [...$('dots').children].forEach((d, k) => d.classList.toggle('done', k <= i));
    s.hops.forEach(([a, b], k) => spawn(a, b, k * 0.9, nodes[a].color));
    const anim = (s.hops.length - 1) * 900 + 1300 + 900;
    await Promise.all([sayAloud(s.say), wait(Math.max(anim, $('voice').checked ? 0 : s.say.length * 55))]);
  }
  if (me !== run) return;
  focus = null; $('stepn').textContent = 'Fim'; $('text').textContent = 'Recomece, ou arraste para ver a cena de outro ângulo.';
}
$('play').onclick = explain;
$('restart').onclick = () => { run++; speechSynthesis?.cancel(); focus = null; $('stepn').textContent = 'Pronto';
  [...$('dots').children].forEach(d => d.classList.remove('done')); explain(); };
speechSynthesis?.getVoices();
</script>
</body>
</html>
